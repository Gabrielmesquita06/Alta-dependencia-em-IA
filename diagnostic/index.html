<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Use Mind - Resultado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>
<body>

  <header class="d-flex align-items-center justify-content-center mb-4"
      style="background-color: #0a5e7a; height: 80px;">
    <a href="../main/index.html"><img src="../icons/logo.png" alt="Logo" height="80"></a>
  </header>

  <div class="container pb-5">
    <div class="result-wrapper mx-auto">

      <!-- Cabeçalho -->
      <div class="text-white p-4 rounded-top">
        <h1 class="fs-3 mb-2">Seu diagnóstico</h1>
        <p class="mb-0 opacity-75">Veja abaixo o resultado do seu nível de dependência de IA</p>
      </div>

      <!-- Card de resultado -->
      <div class="card border-light shadow-lg">
        <div class="card-body p-4">
          <h3 id="potuação" class="fs-6 fw-semibold text-dark mb-3">Pontuação</h3>

          <p class="fw-semibold text-dark mb-2 text-center">Nível</p>
          <div id="nivel" class="caixa-nivel mb-4">—</div>

          <p id="Mensagem" class="text-dark">Mensagem</p>

          <div class="d-flex flex-column flex-sm-row gap-3 mt-4">
            <a href="../form/index.html?refazer=1" class="btn bg-blue text-white fw-bold px-4 flex-fill">Responder novamente</a>
            <a href="#" class="btn bg-blue text-white fw-bold px-4 flex-fill">Preparar rotina de exercícios</a>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
