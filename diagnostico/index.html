<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Use Mind - Resultado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <header class="header text-center py-4">
    <h1 class="m-0">Use Mind</h1>
  </header>

  <main class="container flex-grow-1 py-5">
    <div class="row justify-content-center g-4">

      <!-- Card de resultado -->
      <section class="col-12 col-md-8 col-lg-6">
        <div class="card-resultado p-4 h-100">
          <h2 class="text-center mb-3">Resultado</h2>
          <p>E aí? Como está seu uso?</p>

          <div class="text-center mt-5">
            <p class="fw-semibold mb-2">Nível</p>
            <div id="nivel" class="nivel-box d-flex align-items-center justify-content-center">—</div>
          </div>

          <p id="mensagem" class="text-center mt-4">Mensagem dependendo do nível</p>

          <div class="d-flex flex-column flex-sm-row gap-3 mt-4">
            <a href="../landing-page/index.html" class="btn btn-escuro flex-fill">Responder novamente</a>
            <a href="#" class="btn btn-escuro flex-fill">Preparar rotina de exercícios</a>
          </div>
        </div>
      </section>

      <!-- Legenda dos níveis -->
      <aside class="col-12 col-md-4 col-lg-3">
        <div class="d-flex flex-column gap-3">
          <div class="legenda critico">Crítico</div>
          <div class="legenda atencao">Atenção</div>
          <div class="legenda correto">Uso Correto</div>
        </div>
      </aside>

    </div>
  </main>

  <footer class="footer text-center py-3">
    <span>Rodapé</span>
  </footer>

</body>
</html>
