<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <!-- Cabeçalho com a logo -->
    <header class="d-flex align-items-center justify-content-center mb-4"
        style="background-color: #0a5e7a; height: 80px;">
        <img src="../icons/logo.png" alt="Logo" height="80">
    </header>

    <main class="container pb-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-9 d-flex flex-column gap-4">

                <!-- ============ CARTÃO: RESUMO DO USUÁRIO ============ -->
                <!-- Dados vindos de getDashboardData(): level, routine_start, routine_end,
                     exercise_time, time_without_IA -->
                <div class="card bg-white text-dark border-0 shadow-sm diagnostico-card p-4">
                    <div class="row text-center g-3">
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">Nível</div>
                            <div class="fw-semibold fs-5 nivel-box" id="nivel">---</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">Horário sem IA</div>
                            <div class="fw-semibold fs-5">
                                <span id="horarioInicio">--:--</span> às <span id="horarioFim">--:--</span>
                            </div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">Horas sem IA</div>
                            <div class="fw-semibold fs-5"><span id="horasSemIA">-</span> h</div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">Quantidade de exercícios</div>
                            <div class="fw-semibold fs-5"><span id="QuantidadeExercicios">-</span> </div>
                        </div>
                    </div>
                </div>

                <!-- ============ CARTÃO: BARRA DE PROGRESSO ============ -->
                <div class="card bg-white text-dark border-0 shadow-sm p-4">
                    <div class="d-flex justify-content-between align-items-baseline mb-2">
                        <h2 class="fs-6 fw-semibold mb-0">Seu progresso</h2>
                        <span class="text-muted small" id="textoProgresso">Dia 0 de 0</span>
                    </div>

                    <!--
                        Barra de progresso do Bootstrap:
                        - .progress     -> a "calha" (o fundo cinza)
                        - .progress-bar -> a parte preenchida. A largura é o style="width: X%"
                        - aria-valuenow -> mesmo valor do width, para leitores de tela
                        Para atualizar no JS:
                          barra.style.width = "40%";
                          barra.textContent = "40%";
                          barra.setAttribute("aria-valuenow", 40);
                    -->
                    <div class="progress" style="height: 24px;" role="progressbar" aria-label="Progresso do usuário"
                        aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" id="progressoWrapper">
                        <div class="progress-bar progress-bar-striped bg-primary" id="barraProgresso"
                            style="width: 0%">0%</div>
                    </div>
                </div>

                <!-- ============ SEÇÃO: CARDS DOS EXERCÍCIOS ============ -->
                <div>
                    <h2 class="fs-5 fw-semibold text-white mb-3">
                        Seus exercícios
                        <span class="badge bg-secondary ms-2 fw-normal">
                            <span id="duracaoExercicios">-</span> h
                        </span>
                    </h2>

                    <!-- O JS coloca os cards aqui dentro (um col por exercício) -->
                    <div class="row g-3" id="listaExercicios"></div>
                </div>

            </div>
        </div>
    </main>

    <!--
        MOLDE do card de exercício (não aparece na tela).
        No JS: clone este template, preencha os campos e adicione em #listaExercicios.
          const molde = document.getElementById("moldeExercicio");
          const card = molde.content.cloneNode(true);
          card.querySelector(".ex-tipo").textContent = ex.type;
        Campos de cada exercício: id, type, img, question
    -->
    <template id="moldeExercicio">
        <div class="col-12 col-md-6">
            <div class="card bg-white text-dark border-0 shadow-sm h-100">
                <!-- Esconda a imagem (hidden = true) quando ex.img estiver vazio -->
                <img class="card-img-top ex-img" src="" alt="" hidden>
                <div class="card-body">
                    <span class="badge bg-primary ex-tipo">Tipo</span>
                    <p class="card-text mt-2 mb-0 ex-pergunta">Pergunta do exercício</p>
                </div>
            </div>
        </div>
    </template>

    <script type="module" src="script.js"></script>
</body>

</html>
